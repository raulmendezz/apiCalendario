spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
app.security.jwt-secret=test-secret-key-at-least-32-characters!!
app.security.jwt-expiracion-minutos=60
app.security.admin1-username=admin_test
app.security.admin1-password=admin_pass_test
app.security.user1-username=user_test
app.security.user1-password=userpass_test
