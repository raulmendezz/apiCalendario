spring.application.name=gestion-digital-permisos
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestion_digital_permisos?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Madrid}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.jakarta.persistence.database-major-version=8
spring.jpa.properties.jakarta.persistence.database-minor-version=0
springdoc.swagger-ui.path=/swagger-ui.html
server.error.include-message=never
app.security.jwt-secret=${JWT_SECRET}
app.security.jwt-expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}
app.security.admin1-username=${ADMIN1_USERNAME:admin}
app.security.admin1-password=${ADMIN1_PASSWORD}
app.security.user1-username=${USER1_USERNAME:user}
app.security.user1-password=${USER1_PASSWORD}
